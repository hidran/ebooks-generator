            - generic [ref=f13e49]: 
            - text: giulia@example.com
          - paragraph [ref=f13e50]: All SQL lives in repositories, and every value is bound, never concatenated. With PDO configured to use real prepared statements, SQL injection stops being a discipline you must remember at each query and becomes the default.
      - article [ref=f13e51]:
        - generic [ref=f13e52]:
