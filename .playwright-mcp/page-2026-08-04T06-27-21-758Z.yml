          - paragraph [ref=f13e32]: Reproducible from a Dockerfile, verified on every push by a CI matrix across PHP 8.4 and 8.5, and deployed with an atomic Helm release that rolls back on failure. Enterprise is not complexity — it is reproducibility.
      - article [ref=f13e33]:
        - generic [ref=f13e34]:
          - heading [level=2] [ref=f13e35]:
            - link "Caching with Redis behind an interface" [ref=f13e36] [cursor=pointer]:
