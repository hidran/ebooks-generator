            - text: giulia@example.com
          - paragraph [ref=f13e59]: "The Kernel builds a container that wires PDO, repositories and services together. Controllers no longer construct their own dependencies: they receive them in the constructor, which is exactly what makes every piece testable in isolation."
      - article [ref=f13e60]:
        - generic [ref=f13e61]:
