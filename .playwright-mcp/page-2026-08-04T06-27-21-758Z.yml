            - generic [ref=f13e40]: 
            - text: demo@example.com
          - paragraph [ref=f13e41]: "A CachedPostRepository decorates the plain repository: cache hit returns instantly, cache miss falls back to SQL and stores the result. The original repository never learns that a cache exists — open for extension, closed for modification."
      - article [ref=f13e42]:
        - generic [ref=f13e43]:
          - heading [level=2] [ref=f13e44]:
            - link "Prepared statements and safe queries" [ref=f13e45] [cursor=pointer]:
              - /url: /posts/4
          - paragraph [ref=f13e46]:
