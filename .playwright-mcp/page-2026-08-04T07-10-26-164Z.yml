        - link "demo@example.com" [ref=f16e49] [cursor=pointer]:
          - /url: mailto:demo@example.com
      - text: Every request enters through public/index.php, the router matches the URL against a table of routes, and dispatches to a controller method. No framework yet â€” just the bare mechanism a framework later automates.
