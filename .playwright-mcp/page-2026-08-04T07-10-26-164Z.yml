        - text: by
        - link "demo@example.com" [ref=f16e28] [cursor=pointer]:
          - /url: mailto:demo@example.com
      - text: Readers leave comments, users sign in, and the session remembers them. Simple, procedural, and complete â€” the perfect baseline to appreciate what the enterprise architecture adds on top.
    - article [ref=f16e29]:
      - heading [level=2] [ref=f16e30]:
        - link "Talking to MySQL with PDO" [ref=f16e31] [cursor=pointer]:
          - /url: /post/4
      - paragraph [ref=f16e32]:
        - time [ref=f16e33]: 2026-07-14 08:30:00
        - text: by
        - link "giulia@example.com" [ref=f16e35] [cursor=pointer]:
          - /url: mailto:giulia@example.com
      - text: A small DbFactory builds a PDO connection from a config array. It already fetches objects and throws on error â€” the seeds of the safe, injected connection the enterprise version will grow into.
    - article [ref=f16e36]:
      - heading [level=2] [ref=f16e37]:
        - link "Models, controllers and plain PHP views" [ref=f16e38] [cursor=pointer]:
          - /url: /post/3
      - paragraph [ref=f16e39]:
        - time [ref=f16e40]: 2026-07-09 16:05:00
        - text: by
        - link "giulia@example.com" [ref=f16e42] [cursor=pointer]:
          - /url: mailto:giulia@example.com
      - text: The Post model runs the SQL, the controller coordinates, and the view is a plain PHP template rendered with output buffering. The same separation you will meet again, formalised, in the enterprise remake.
    - article [ref=f16e43]:
      - heading [level=2] [ref=f16e44]:
        - link "A front controller and a tiny router" [ref=f16e45] [cursor=pointer]:
