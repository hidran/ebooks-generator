        - link "demo@example.com" [ref=f16e21] [cursor=pointer]:
          - /url: mailto:demo@example.com
      - text: Feeling the pain a framework removes is the fastest way to understand what it buys you. Build the free MVC first; adopt PSR-7/15, a container and repositories second.
    - article [ref=f16e22]:
      - heading [level=2] [ref=f16e23]:
        - link "Comments, sessions and login" [ref=f16e24] [cursor=pointer]:
