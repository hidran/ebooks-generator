deck:
  title: "IA agéntica en PHP con NeuronAI"
  module: "Módulo 7"
  subtitle: "Transmisión"

slides:
  - layout: cover
    kicker: "Módulo 7 · Parte II — PHP puro y Composer"
    title: "Transmisión"
    subtitle: "Latencia percibida, mostrar el trabajo, y conectar un agente a un frontend moderno sin escribir fontanería de protocolo."
    meta: "IA agéntica en PHP con NeuronAI · Hidran Arias"
    notes: |
      Dos lecciones teóricas aquí; las 7.2–7.4 son prácticas.
      El encuadre que importa: la transmisión no es un acabado. La Lección 1.4
      estableció un problema estructural de latencia, y esta es la mitigación.

  - layout: agenda
    kicker: "Módulo 7 · lecciones teóricas"
    title: "La latencia que se nota, y el cable por el que viaja"
    items:
      - {id: "7.1", title: "Por qué importa la transmisión", note: "Qué arregla, y qué no"}
      - {id: "7.5", title: "Adaptadores de transmisión y protocolos de UI", note: "AG-UI, Vercel AI SDK y transportes propios"}
    notes: |
      La 7.1 es corta y conceptual; la 7.5 es la lección más larga y práctica del
      módulo. Reparte el tiempo en consecuencia.

lessons:
# ═══════════════════════════════════════════════════════ 7.1
- id: "7.1"
  title: "Por qué importa la transmisión"
  duration: "9 minutos"
  type: "Teoría"
  notes: |
    La lección teórica más corta de la Parte II. Una afirmación contraintuitiva,
    un beneficio infravalorado, y una lista de casos donde transmitir está mal.
  slides:
    - layout: objectives
      text: "Entender qué arregla y qué no arregla la transmisión, para aplicarla donde ayuda."
      notes: |
        Abre con el número de la Lección 1.4: una ejecución de agente de cinco
        iteraciones con ejecución de herramientas llega a 10–20 segundos de reloj.
        Nadie espera 20 segundos ante una pantalla en blanco.

    - layout: lead
      kicker: "La parte contraintuitiva"
      title: "La transmisión no hace nada más rápido"
      text: "El tiempo total es idéntico.\nCada token, cada llamada a herramienta, cada ida y vuelta tarda exactamente lo mismo."
      note: "Lo que cambia es cuándo ve el primer token quien está delante: 800 milisegundos en vez de 12 segundos de nada."
      notes: |
        Di la primera línea sin adornos y deja que la gente se quede brevemente
        confusa — es una confusión útil.
        Luego resuélvela: la transmisión es un arreglo de percepción, no de
        rendimiento. Quien espera una ganancia de rendimiento y no la encuentra a
        veces concluye que la transmisión "no funcionó".

    - layout: chart
      kicker: "Lo que la gente siente de verdad"
      title: "Tiempo hasta el primer token, en milisegundos"
      kind: bar
      labels: true
      height: 3.4
      caption: "Una respuesta que se transmite durante 15 segundos parece más rápida que una que bloquea 8."
      categories: ["Transmisión — primer token", "Bloqueante — respuesta completa"]
      series:
        - name: "Milisegundos hasta que se ve algo"
          values: [800, 12000]
          color: accent
      notes: |
        Señala las dos barras: el trabajo total es el mismo en ambos casos; solo
        cambia el momento de la primera señal.
        El principio es de diseño de interfaces en general — la espera percibida
        la domina el tiempo hasta el primer token, no el tiempo hasta el final — y
        es inusualmente marcado con texto, porque se puede empezar a leer mientras
        llega el resto.

    - layout: code
      kicker: "El segundo beneficio, que está infravalorado"
      title: "Muestra qué está haciendo el agente, no solo qué dijo"
      width: 7.8
      highlight: ["→"]
      code: |
        Let me check that for you.
          → Looking up order #4471...
          → Found it. Checking refund eligibility...
        The order is eligible for a full refund.
      side_notes:
        - "Los tipos de fragmento de NeuronAI incluyen llamadas a herramientas y sus resultados, así que puedes representar el avance del agente, no solo su prosa."
        - "Es un producto completamente distinto de un indicador de carga: se ve el progreso, se entiende por qué tarda, y se nota que el sistema está trabajando en el problema correcto antes de terminar."
        - "La Lección 7.4 lo construye."
      notes: |
        Es la diapositiva que cambia lo que construyen. Un indicador de carga dice
        "espera"; esto dice "esto es lo que estoy haciendo y por qué tarda".
        El tercer punto es el sutil y merece enunciarse: se puede saber que el
        agente está trabajando en el problema CORRECTO antes de que termine. Lo
        que significa que se puede abandonar pronto una ejecución equivocada en
        vez de esperarla.

    - layout: cards
      kicker: "Cuándo no transmitir"
      title: "Cuatro casos donde es la herramienta equivocada"
      columns: 4
      height: 2.7
      items:
        - {marker: "1", title: "Lotes y trabajos en segundo plano", text: "Nadie está mirando."}
        - {marker: "2", title: "Salida estructurada", text: "Necesitas el objeto completo y validado. Uno leído a medias no sirve.", tone: warn}
        - {marker: "3", title: "Respuestas muy breves", text: "Transmitir una respuesta de dos palabras añade complejidad para nada."}
        - {marker: "4", title: "Respuestas que hay que posprocesar", text: "Filtrado, ocultación, formateo — necesitas el texto entero primero.", tone: warn}
      notes: |
        La tarjeta 2 enlaza directamente con el Módulo 6 — las dos capacidades
        están en tensión real, y no deben intentar hacer ambas sobre la misma
        respuesta.
        La tarjeta 4 es la que pilla a quien trabaja en entornos regulados: no
        puedes ocultar una transmisión que ya has enviado.

    - layout: takeaways
      items:
        - "La transmisión cambia la latencia percibida, no la real."
        - "El tiempo hasta el primer token es lo que se siente."
        - "Transmitir la actividad de las herramientas es una capacidad de producto, no solo un indicador de progreso."
        - "No para trabajo por lotes, salida estructurada, ni respuestas que hay que posprocesar."
      notes: |
        El punto 3 es el que merece repetirse — casi todos los equipos implementan
        la transmisión y se paran en el texto, dejando sin construir la mejor
        parte.

# ═══════════════════════════════════════════════════════ 7.5
- id: "7.5"
  title: "Adaptadores de transmisión y protocolos de UI"
  duration: "13 minutos"
  type: "Teoría con código"
  notes: |
    La recompensa práctica del módulo. Es también la lección que muestra sin
    ruido que la arquitectura es coherente: el mismo diseño guiado por interfaces
    del cambio de proveedor, aplicado al lado de la salida.
  slides:
    - layout: objectives
      text: "Conectar un agente NeuronAI a un frontend moderno sin escribir fontanería de protocolo."
      notes: |
        Enuncia el problema que resuelven los adaptadores: tu agente produce
        fragmentos de NeuronAI, tu frontend habla un protocolo. Sin adaptadores
        escribes a mano la traducción — eventos del ciclo de vida de los mensajes,
        formateo de eventos, seguimiento de identificadores — y la reescribes cada
        vez que el protocolo se mueve.

    - layout: flow_chain
      kicker: "El diseño"
      title: "El adaptador se sitúa en la frontera"
      caption: "El código de tu agente no cambia. Es el cambio de proveedor de la Lección 3.6, aplicado al lado de la salida."
      gap: 0.5
      nodes:
        - {text: "Tu agente", note: "sin cambios"}
        - {text: "Fragmentos NeuronAI", note: "eventos internos", tone: accent}
        - {text: "Adaptador", note: "el traductor", tone: ok}
        - {text: "Eventos de protocolo", note: "AG-UI · Vercel"}
        - {text: "Tu frontend", note: "habla su propio idioma"}
      notes: |
        Traza el paralelo explícitamente: en el lado de la entrada, la interfaz de
        proveedor te deja cambiar Anthropic por Ollama sin tocar el agente. En el
        lado de la salida, la interfaz de adaptador te deja cambiar AG-UI por
        Vercel sin tocar el agente.
        Di por qué importa: demuestra que la arquitectura es coherente y no
        accidental. La misma idea aparece dondequiera que haya una frontera.

    - layout: code
      kicker: "Conectar un adaptador"
      title: "Una llamada a `setStreamAdapter()`"
      width: 8.6
      highlight: ["new AGUIAdapter(", "new VercelAIAdapter()"]
      code: |
        use NeuronAI\Agent\Adapters\AGUIAdapter;

        $stream = MyAgent::make()
            ->setThreadId('thread_123')
            ->setStreamAdapter(fn (): AGUIAdapter => new AGUIAdapter(threadId: 'thread_123'))
            ->stream(new UserMessage('What is the square root of 144?'));

        foreach ($stream as $event) {
            echo json_encode($event) . "\n";
        }

        // Same agent, different frontend protocol:
        use NeuronAI\Agent\Adapters\VercelAIAdapter;

        $agent->setStreamAdapter(fn (): VercelAIAdapter => new VercelAIAdapter());
      notes: |
        La frase para decir en voz alta: el código de tu agente no cambia. Solo
        cambia la factory que pasas a setStreamAdapter().
        Dos cosas que conviene decir. El adaptador se conecta con una factory, no con
        una instancia, porque un adaptador guarda el estado de una sola transmisión:
        el agente construye uno nuevo para cada segmento de ejecución. Y lo que el
        bucle produce son eventos de protocolo, no líneas — SSEEncoder los convierte
        en bytes en el borde HTTP.
        El código antiguo llama a stream() y luego a ->events($adapter) sobre el
        resultado, o itera stream() y hace echo de $chunk. Ninguno de los dos
        funciona en esta versión (Lección 7.2).

    - layout: code
      kicker: "Un punto de conexión AG-UI completo"
      title: "Cinco detalles fáciles de equivocar"
      width: 9.2
      highlight: ["threadId:", "runId:", "flush();"]
      code: |
        use NeuronAI\Agent\Adapters\AGUIAdapter;
        use NeuronAI\Chat\Messages\UserMessage;
        use NeuronAI\Workflow\Streaming\SSEEncoder;

        $input = json_decode(file_get_contents('php://input'), true);

        $messages = $input['messages'];
        $last = array_last($messages); // PHP 8.5

        if (($last['role'] ?? null) !== 'user') {
            http_response_code(400);
            exit('A new turn must end with a user message.');
        }

        // $input['threadId'] came from the browser: authorise it first.

        $adapter = new AGUIAdapter(
            threadId: $input['threadId'],
            runId: $input['runId'] ?? null,
            messages: $messages,
        );

        $stream = MyAgent::make(workflowId: $input['threadId'])
            ->setStreamAdapter(fn (): AGUIAdapter => $adapter)
            ->stream(new UserMessage((string) $last['content']));

        $stream->valid(); // until the first frame, a refusal can still be an HTTP status

        foreach ($adapter->getHeaders() as $name => $value) {
            header("{$name}: {$value}");
        }

        foreach (SSEEncoder::encode($stream) as $line) {
            echo $line;
            flush();
        }
      notes: |
        Cinco cosas que señalar, en orden.
        Una: los clientes AG-UI hacen POST de una carga RunAgentInput — no simplemente
        abren una conexión. Lleva threadId, runId, el historial de mensajes, las
        herramientas que el cliente puede ejecutar y el estado compartido.
        Dos: el hilo es la conversación, y lo eligió el navegador. El adaptador
        devuelve threadId en RUN_STARTED y RUN_FINISHED; el agente queda ligado al
        mismo valor mediante make(workflowId:). Eso convierte threadId en entrada no
        confiable usada como clave de almacenamiento: autoriza antes a la persona
        autenticada. runId es el identificador por petición del cliente — pásalo y el
        adaptador lo devuelve; si lo omites, el adaptador se inventa uno, bien para
        pruebas, mal para un cliente real que espera correlacionar la transmisión con
        la ejecución que pidió.
        Tres: al agente solo le llega el último mensaje del usuario; su propio almacén
        de mensajes guarda el hilo, así que con el almacén en memoria por defecto cada
        petición sería una conversación nueva. Un array resume o un mensaje de
        herramienta al final es una continuación, no un turno nuevo — este punto de
        conexión la rechaza.
        Cuatro: el generador es perezoso. $stream->valid() extrae el primer evento
        mientras un rechazo aún puede ser un estado HTTP; después, solo
        SSEEncoder::encode() debe iterarlo.
        Cinco: getHeaders() te da las cabeceras SSE — envíalas — y flush() después de
        cada línea. La advertencia de la Lección 7.3, repetida por algo: olvidarlo
        produce una transmisión que llega toda de golpe al final, lo que se ve
        exactamente como que la transmisión no funciona.

    - layout: table
      kicker: "El mapeo de eventos"
      title: "Fragmento NeuronAI → eventos AG-UI"
      widths: [1.3, 3.2]
      columns: ["Fragmento NeuronAI", "Eventos AG-UI"]
      rows:
        - ["Ciclo de vida", "RUN_STARTED, RUN_FINISHED"]
        - ["TextChunk", "TEXT_MESSAGE_START, TEXT_MESSAGE_CONTENT, TEXT_MESSAGE_END"]
        - ["ReasoningChunk", "REASONING_START, REASONING_MESSAGE_START, REASONING_MESSAGE_CONTENT, REASONING_MESSAGE_END, REASONING_END"]
        - {tone: accent, cells: ["ToolCallChunk + ToolResultChunk", "TOOL_CALL_START, TOOL_CALL_ARGS, TOOL_CALL_END, TOOL_CALL_RESULT"]}
        - ["Eventos de progreso del flujo", "STEP_STARTED, STEP_FINISHED, ACTIVITY_SNAPSHOT, CUSTOM"]
        - ["Ejecución en pausa por aprobación", "STATE_SNAPSHOT, MESSAGES_SNAPSHOT, luego RUN_FINISHED con resultado interrupt"]
        - ["Ejecución fallida", "RUN_ERROR"]
      caption: "La fila acentuada es lo que hace posible el \"mostrar el trabajo\" de la Lección 7.1 — pero llega con búfer: los cuatro eventos TOOL_CALL_* juntos, cuando el resultado ya existe."
      notes: |
        No leas la tabla entera — señala la forma. Cada fragmento de NeuronAI se
        expande en un trío inicio/contenido/fin sobre el cable, y eso es lo que
        permite a un cliente representar mensajes parciales con limpieza.
        La fila acentuada es la que lleva la actividad de las herramientas, y es la
        base del panel de progreso de la Lección 7.4 — pero ojo: llega con búfer, una
        llamada del lado del servidor se publica como los cuatro eventos TOOL_CALL_*
        juntos cuando el resultado existe, así que para una herramienta lenta la línea
        "comprobando…" tiene que venir de otro sitio. Una ejecución en pausa termina
        con un RUN_FINISHED que lleva un resultado interrupt, no con un final normal.

    - layout: cards
      kicker: "Qué cubre el adaptador, y el hueco que queda"
      title: "Conoce el límite antes de comprometerte con un diseño que dependa de él"
      columns: 2
      height: 3.0
      items:
        - marker: "CUBIERTO"
          title: "Herramientas definidas por el frontend"
          tone: ok
          text: "Las herramientas que un cliente lista en el campo `tools` de `RunAgentInput` — ejecutadas en el navegador — pueden asociarse al agente como herramientas diferidas.\n\nLa ejecución se suspende, el adaptador publica la llamada, el cliente la ejecuta y envía el resultado en su siguiente petición: una continuación, no un turno nuevo."
        - marker: "EL HUECO"
          title: "El estado compartido se devuelve, no se sincroniza"
          tone: warn
          text: "El adaptador devuelve el `state` y los `messages` que envió el cliente como `STATE_SNAPSHOT` y `MESSAGES_SNAPSHOT` cuando una ejecución se pausa.\n\nNunca emite `STATE_DELTA`, y nada en el agente escribe en el estado AG-UI."
      notes: |
        Si están evaluando CopilotKit o un frontend AG-UI parecido, este límite
        decide si la integración funciona.
        Dilo como consejo práctico: comprueba si el diseño de tu frontend depende de
        que el agente modifique el estado compartido en vivo antes de comprometerte.

    - layout: code
      kicker: "Adaptadores propios"
      title: "Cinco métodos"
      width: 7.6
      highlight: ["transform"]
      code: |
        namespace NeuronAI\Workflow\Streaming\Adapter;

        interface StreamAdapterInterface
        {
            public function start(): iterable;
            public function transform(object $chunk): iterable;
            public function end(): iterable;
            public function interrupt(InterruptRequest $request): iterable;
            public function error(Throwable $error): iterable;
        }
      side_notes:
        - "`transform()` hace el trabajo: un objeto nativo entra, cero o más eventos salen. `start()` abre el protocolo; exactamente un terminal cierra cada segmento — `end()` al completarse, `interrupt()` cuando la ejecución se pausa, `error()` ante un fallo."
        - "Antes de escribir uno propio, revisa `AgentChunkAdapter`: el vocabulario nativo de NeuronAI, un evento por fragmento. Las cabeceras HTTP no forman parte de la interfaz — añade tú `getHeaders()` si tu protocolo las necesita."
      notes: |
        Interfaz pequeña, y ese es el punto — escribir un adaptador para un
        protocolo que NeuronAI no trae es una tarde, no un proyecto.
        Cada método produce objetos ProtocolEvent, y la factory que pasas a
        setStreamAdapter() construye un adaptador nuevo para cada segmento, así que
        una instancia solo guarda el estado de una transmisión. Devuelve un iterable
        vacío en cualquier método sobre el que tu protocolo no tenga nada que decir.

    - layout: lead
      kicker: "El caso de uso que merece destacarse"
      title: "Un agente en un proceso en cola, transmitiendo a un navegador"
      text: "Los canales empujan los eventos del adaptador hacia un transporte externo como Pusher —\nasí un trabajo en segundo plano puede transmitir su progreso a un navegador con el que no tiene conexión directa."
      note: "Esto resuelve un problema que de otro modo parece intratable: las ejecuciones largas de agente van en un proceso en cola (la aritmética de latencia de la Lección 1.4, la restricción `pcntl` de la Lección 5.13), pero un proceso en cola no tiene conexión HTTP con la persona. Un canal alimentado por el adaptador salva exactamente ese hueco: `setChannel()` recibe una factory, y el trabajo llama a `chat($message, stream: true)` para que cada evento de protocolo salga según se produce. El Módulo 21 lo construye en Laravel."
      notes: |
        Es la diapositiva que hace que los adaptadores parezcan arquitectura y no
        fontanería.
        Plantea el problema antes que la solución: las ejecuciones largas deben ir
        a una cola, y un proceso en cola no puede mantener abierta una conexión
        HTTP. Quien se haya dado con esto lo reconocerá al instante.
        El adaptador decide la forma de la salida; el canal decide adónde va. El
        framework trae PusherChannel, RedisChannel y CallbackChannel bajo
        NeuronAI\Workflow\Streaming\Channel. El verbo es chat() con stream: true,
        no stream(): stream() entregaría al trabajo un generador que nadie itera. Y
        lo transmitido es efímero — nunca hagas depender la corrección de que un
        cliente reciba un elemento de la transmisión.

    - layout: lead
      kicker: "Evaluación del Módulo 7"
      title: "Mídelo, luego muestra el trabajo"
      text: "1 · Convierte un agente del Módulo 5 de `chat()` a `stream()`. Mide el tiempo hasta el primer token en ambos casos.\n2 · Añade el panel de progreso de herramientas con una lista de etiquetas permitidas y un respaldo seguro.\n3 · Esboza qué adaptador usarías para tu propio frontend — e identifica si el hueco de AG-UI en el estado compartido te afectaría."
      notes: |
        El paso 1 es el que hace concreta la Lección 7.1: deben ver sus propios
        números, no los de la diapositiva.
        La lista de permitidos del paso 2 es un detalle de seguridad, no un
        capricho — los nombres y argumentos de herramientas pueden llevar
        contenido influido por el usuario, y pintarlos directos en una interfaz es
        una superficie de inyección.

    - layout: takeaways
      items:
        - "Los adaptadores traducen fragmentos de NeuronAI a un protocolo de frontend; el código del agente no cambia."
        - "Los clientes AG-UI hacen POST de un `RunAgentInput` — devuelve `threadId` y `runId`."
        - "`flush()` tras cada línea, o la transmisión llega toda de golpe."
        - "Una carencia: el estado compartido se devuelve, nunca se sincroniza en vivo; las herramientas definidas por el frontend sí se admiten."
      notes: |
        Cierra el Módulo 7. Lo siguiente son los adjuntos y la multimodalidad —
        donde el sistema de bloques de contenido de la Lección 4.1 por fin se usa
        de verdad.

closing:
  - layout: handson
    kicker: "Módulo 7 · Práctica"
    title: "Tres lecciones con el teclado"
    lessons_title: "Con el teclado"
    lessons:
      - {id: "7.2", title: "stream() y sus fragmentos", duration: "13 min"}
      - {id: "7.3", title: "Transmitir desde la CLI", duration: "11 min"}
      - {id: "7.4", title: "Transmisión con herramientas", duration: "14 min"}
    build_kicker: "Construirás"
    build_title: "Una CLI que transmite token a token"
    build: "En este módulo no hay un lab aparte: las tres lecciones construyen una sola cosa de principio a fin y terminan en el caso difícil — transmitir mientras el agente además llama a herramientas, para que el usuario vea que algo ocurre en lugar de un cursor parado."
    repo_kicker: "Código"
    repo: "chapters/Ch07"
    repo_note: "`run/stream.php` — salida token a token con tiempos."
    notes: |
      La 7.4 es la lección que se recuerda: las llamadas a herramientas
      interrumpen la transmisión de tokens, y manejarlo bien es lo que hace
      que un agente parezca ágil.
  - layout: outro
    kicker: "Fin del Módulo 7"
    title: "Siguiente: Adjuntos\ny multimodalidad"
    note: "Módulo 8 — imágenes, documentos y audio a través del sistema de bloques de contenido, y el diseño de costes que los acompaña."
    notes: |
      Recuérdales el SourceType::ID de la Lección 4.1 — sube una vez, referencia
      por ID. El Módulo 8 es donde ese ahorro se construye.
