deck:
  title: "IA agéntica en PHP con NeuronAI"
  module: "Módulo 17"
  subtitle: "El SDK de Laravel"

slides:
  - layout: cover
    kicker: "Módulo 17 · Parte V — Laravel"
    title: "El SDK de Laravel"
    subtitle: "Una forma segura frente a la concurrencia de asignar un hilo a un agente, y las directrices que impiden que tu asistente escriba código para versiones antiguas."
    meta: "IA agéntica en PHP con NeuronAI · Hidran Arias"
    notes: |
      Empieza la Parte V. Casi todo el Módulo 17 es práctico — instalación,
      configuración, fachadas, inyección de dependencias. Estas dos lecciones son
      las conceptuales.
      Ten presente el encuadre de la Lección 2.5 durante toda la Parte V: el SDK
      añade comodidad, no capacidad.

  - layout: agenda
    kicker: "Módulo 17 · lecciones teóricas"
    title: "Dos cosas que conviene entender antes de servir agentes desde Laravel"
    items:
      - {id: "17.5", title: "Copiar, no mutar", note: "La historia de concurrencia del agente"}
      - {id: "17.7", title: "Laravel Boost y desarrollo asistido por IA", note: "Directrices para asistentes de código"}
    notes: |
      La 17.5 es corta pero evita una clase de fallo genuinamente desagradable. La
      17.7 es orientación, y cierra un círculo alrededor del cual el curso lleva
      girando desde los avisos de versión del Módulo 2.

lessons:
# ═══════════════════════════════════════════════════════ 17.5
- id: "17.5"
  title: "Copiar, no mutar: la historia de concurrencia del agente"
  duration: "10 minutos"
  type: "Teoría — corta, y digna de lección propia"
  notes: |
    Diez minutos sobre una sola decisión de diseño, porque el fallo que evita es
    invisible en desarrollo y grave en producción.
    Para un público sénior, el patrón transferible importa más que el detalle de
    la API — dilo.
  slides:
    - layout: objectives
      text: "Entender por qué asignar un hilo a un agente con `for()`, que devuelve una copia, es seguro en un entorno de larga vida."
      notes: |
        Plantea primero la pregunta: el contenedor te entrega un agente, y en un
        entorno de ejecución de larga vida un objeto puede sobrevivir a la petición
        que lo pidió. Entonces, ¿qué pasa cuando una petición le asigna un hilo, o
        le añade una herramienta?

    - layout: code
      kicker: "El problema que resuelve"
      title: "Lo que haría una implementación ingenua"
      width: 8.8
      highlight: ["...whose conversation is this"]
      code: |
        // Request A
        $agent->setThreadId($aliceThread)
            ->addTool(new AdminDeleteTool())
            ->chat(new UserMessage('Delete the oldest log file'));

        // Request B, milliseconds later, different user, same instance
        $agent->chat(new UserMessage('What is in my history?'));  // ...whose conversation is this, and does it have the admin tool?
      side_notes:
        - "`setThreadId()` y `addTool()` cambian el objeto sobre el que se llaman, así que la petición B se ejecutaría en el hilo de Alice, con sus mensajes en el prompt y la herramienta de administración disponible."
        - "Una fuga de datos y privilegios entre peticiones que solo aparece bajo Octane, solo a veces — y una petición B que asigna antes su propio hilo recibe solo una `WorkflowException`: un agente ya asignado no puede reapuntarse."
      notes: |
        Deja colgando un momento la pregunta del comentario antes de responderla.
        Explica por qué es el peor tipo de fallo: invisible bajo PHP-FPM,
        intermitente bajo Octane, y filtra datos y privilegios en vez de limitarse a
        romperse. Los fallos de seguridad intermitentes son los más difíciles de
        encontrar.

    - layout: code
      kicker: "El diseño"
      title: "`for()` devuelve una copia asignada y deja en paz al receptor"
      width: 9.0
      highlight: ["// $agent is untouched"]
      code: |
        $response = $agent->for($threadId)
            ->addTool(new SearchTool())
            ->addMiddleware(ToolNode::class, new AuditTrail())
            ->chat(new UserMessage('Hello!'))
            ->getMessage();

        // $agent is untouched — no thread, no tools, no middleware
        $agent->for($otherThreadId)->chat(new UserMessage('Hello!'));
      side_notes:
        - "`for()` es la respuesta del framework, y su comentario enuncia el contrato: \"A copy bound to $workflowId; the receiver is never modified.\" Para un agente el ID de flujo es el ID de hilo."
        - "La fachada del SDK sigue la misma regla, como dice su README — pero no tiene forma de asignar un hilo, así que en neuron-ai 4.0.3 lanza una excepción. `for()` tiene ambas cosas."
      notes: |
        Señala el comentario de la última línea: sin hilo, sin herramientas, sin
        middleware — la configuración se fue a una copia que ya se ha descartado.

    - layout: cards
      kicker: "Por qué esto merece una lección"
      title: "Dos razones"
      columns: 2
      height: 3.1
      items:
        - marker: "1"
          title: "Es una propiedad de seguridad, no una comodidad"
          tone: ok
          text: "En un despliegue sin estado con PHP-FPM el fallo sería invisible. Bajo Octane sería una fuga de datos.\n\nEl diseño se anticipa al modelo de despliegue que tu audiencia usa cada vez más."
        - marker: "2"
          title: "Es un patrón que merece robarse"
          tone: accent
          text: "Configuración inmutable por defecto sobre un servicio compartido — `withX()` devolviendo un clon en vez de `setX()` mutando — es buen diseño en general.\n\nCasi todo el mundo en PHP ha escrito la versión mutante al menos una vez."
      notes: |
        Para un público sénior, nombrar el patrón vale más que el detalle de la
        API: un servicio compartido debería repartir copias configuradas, no dejar
        que quien lo llama lo reconfigure.
        Esa frase generaliza mucho más allá de NeuronAI, y la aplicarán a sus
        propias clases de servicio.

    - layout: code
      kicker: "La regla práctica"
      title: "La configuración no se acumula entre sentencias"
      width: 8.8
      highlight: ["// This does NOT work as it appears to"]
      code: |
        // This does NOT work as it appears to
        $agent->for($threadId);
        $agent->chat(new UserMessage('...'));  // AgentException — $agent still has no thread

        // Chain it, or hold the copy
        $bound = $agent->for($threadId);
        $bound->chat(new UserMessage('...'));  // runs on $threadId
      notes: |
        Sencillo una vez dicho, y cinco minutos de confusión si no se dice.
        Es la consecuencia práctica directa de la propiedad de seguridad — el mismo
        diseño que evita la fuga es lo que hace que el primer fragmento no asigne
        nada.
        La otra mitad de la regla: addTool() y addMiddleware() siguen cambiando el
        objeto sobre el que se llaman, así que llámalos sobre la copia que devolvió
        for(), nunca sobre la instancia que te dio el contenedor — y no registres el
        agente como singleton desde el principio.

    - layout: takeaways
      items:
        - "`for()` devuelve una copia asignada a un hilo; el agente que construyó el contenedor nunca se modifica."
        - "Evita la fuga entre peticiones bajo Octane, Swoole y RoadRunner."
        - "Encadena la llamada o guarda la copia devuelta — `for()` en una línea aparte no asigna nada."
        - "`addTool()` y `addMiddleware()` van sobre la copia, no sobre la instancia del contenedor."
        - "Merece robarse como patrón general para servicios compartidos."
      notes: |
        El punto 3 es el que necesitarán en la práctica; el punto 4 es el que
        usarán en otros sitios durante su carrera.

# ═══════════════════════════════════════════════════════ 17.7
- id: "17.7"
  title: "Laravel Boost y desarrollo asistido por IA"
  duration: "8 minutos"
  type: "Orientación"
  notes: |
    Una lección corta de orientación con un metapunto que vale más que la
    funcionalidad. Mantén sobria la advertencia — la lista de verificación de este
    curso es la prueba.
  slides:
    - layout: objectives
      text: "Saber que el paquete incluye directrices para asistentes de código, y cómo pensar sobre eso."
      notes: |
        Sitúalo como una funcionalidad pequeña con una implicación grande, que es
        por lo que tiene una lección en vez de una nota al pie.

    - layout: lead
      kicker: "Qué se incluye"
      title: "Directrices para asistentes de código con IA, integradas con Laravel Boost"
      text: "El ecosistema contiene mucho material para versiones antiguas.\nUn asistente entrenado con código público producirá con aplomo `use NeuronAI\\Agent;`,\n`new Edge(...)`, un middleware `ToolApproval` — API que ya no existen."
      note: "Incluir directrices actuales con el paquete es un arreglo directo. El asistente lee lo que es cierto ahora en vez de lo que era cierto en 2025 — exactamente mientras las directrices vayan al ritmo del código, y en el SDK 2.0.0 no es así."
      notes: |
        Conecta con los avisos de versión de la Lección 2.5 y la deriva de espacios
        de nombres sobre la que ya se les advirtió. Es el mismo problema, atacado
        en la capa de herramientas.

    - layout: cards
      kicker: "La metalección que conviene extraer"
      title: "Una biblioteca que incluye instrucciones para las herramientas que escriben código contra ella"
      columns: 2
      height: 3.0
      items:
        - marker: "SI MANTIENES UN PAQUETE"
          title: "Es una idea de valor inmediato"
          tone: accent
          text: "Si los asistentes de tus usuarios generan código erróneo contra tu biblioteca, esa es tu carga de soporte.\n\nIncluir directrices actuales cuesta menos que responder cincuenta veces a la misma incidencia."
        - marker: "SI CONSTRUYES SISTEMAS AGÉNTICOS"
          title: "Cierra un círculo que el curso lleva rodeando"
          tone: ok
          text: "Puedes conectar la documentación de NeuronAI a Claude Code o Cursor mediante un servidor MCP (Módulo 9), y usar agentes para ayudarte a construir agentes."
      notes: |
        La tarjeta de la izquierda cala en cualquiera que haya publicado un
        paquete. Encuádrala como reducción del coste de soporte, no como novedad.
        La de la derecha es un cierre bonito del círculo — MCP del Módulo 9,
        apuntado a la documentación del framework que están aprendiendo.

    - layout: lead
      kicker: "La advertencia honesta"
      title: "Los asistentes siguen equivocándose con aplomo sobre bibliotecas que se mueven rápido"
      text: "La lista de verificación de este curso es prueba directa:\nla documentación oficial se ha separado del código en decenas de sitios.\nUn asistente que lea esa documentación hereda la desviación."
      note: "Usa asistentes para andamiaje y código repetitivo. Las skills del propio SDK se han quedado atrás: en neuron-laravel 2.0.0 todavía enseñan `make(threadId: ...)`, `setChatHistory()`, `$workflow->resume()` y `abandonRun()`, y ninguno existe en neuron-ai 4.0.3. Instala en su lugar las trece skills que vienen en `vendor/neuron-core/neuron-ai/skills/` (`npx skills add ./vendor/neuron-core/neuron-ai/skills -y`). Verifica cualquier cosa que toque la superficie de la API contra tu versión instalada. Es la misma disciplina que este curso ha aplicado desde el principio — y es un hábito transferible, no una precaución específica de NeuronAI."
      notes: |
        Mantén un tono sobrio y no despectivo. Los asistentes son genuinamente
        útiles aquí; el modo de fallo es concreto y predecible.
        Señala el propio trabajo de verificación del curso como prueba — es una
        fuerte señal de confianza que quien enseña haya comprobado en vez de
        suponer.

    - layout: takeaways
      items:
        - "El paquete incluye directrices actuales para asistentes de código vía Laravel Boost."
        - "Existe porque el corpus público está lleno de código escrito para versiones antiguas — y las skills del SDK también pueden quedarse atrás."
        - "Buen patrón para quien mantiene bibliotecas en general."
        - "Verifica el código generado contra tu versión instalada — siempre."
      notes: |
        El punto 4 es el hábito. Vale para cualquier biblioteca que se mueva
        rápido, no solo para esta.

closing:
  - layout: handson
    kicker: "Módulo 17 · Práctica"
    title: "Cinco lecciones con el teclado, un lab"
    lessons_title: "Con el teclado"
    lessons:
      - {id: "17.1", title: "Instalación y filosofía", duration: "10 min"}
      - {id: "17.2", title: "Configuración", duration: "11 min"}
      - {id: "17.3", title: "Generadores de Artisan", duration: "8 min"}
      - {id: "17.4", title: "La facade Neuron y qué usar en su lugar", duration: "13 min"}
      - {id: "17.6", title: "Facades de componentes", duration: "10 min"}
    build_kicker: "Construirás"
    build_title: "Lab 11 — `POST /api/ask`"
    build: "Un punto de conexión que responde a través de una clase de agente generada y asignada a un hilo. Cinco minutos desde `composer require` hasta la primera respuesta — que es exactamente el sentido del SDK, y exactamente por qué la Parte II iba antes."
    repo_kicker: "Código"
    repo: "hidran/neuronai-php-book"
    repo_note: "El repositorio cubre las Partes II–IV; la Parte V se construye dentro de tu propia app Laravel."
    notes: |
      El contraste con la Parte II es la lección. Quien hizo el trabajo en PHP
      puro sabe qué está haciendo la clase generada por él, y esa es la diferencia
      entre usar un framework y quedar atrapado en él.
  - layout: outro
    kicker: "Fin del Módulo 17"
    title: "Siguiente: agentes como\nciudadanos de primera clase"
    note: "Módulo 18 — inyección de dependencias, almacén de mensajes con Eloquent, persistencia de flujos de trabajo, y mantener separados a los inquilinos en cada componente con estado."
    notes: |
      Señala la Lección 18.3 como la que trae una prueba de seguridad que deberían
      copiar en sus propios proyectos.
