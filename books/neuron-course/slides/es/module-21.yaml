lessons:
# ═══════════════════════════════════════════════════════ 21.6
- id: "21.6"
  title: "Desconexión y coste huérfano"
  duration: "9 minutos"
  type: "Teoría con código"
  notes: |
    Una lección de costes que nadie espera. Abre con el escenario antes de
    cualquier código — es reconocible al instante y ligeramente alarmante, que es
    la reacción correcta.
  slides:
    - layout: objectives
      text: "Dejar de pagar por trabajo que nadie está esperando."
      notes: |
        Una frase, y es toda la lección. Dila y pasa directamente al escenario.

    - layout: lead
      kicker: "El problema del que nadie habla"
      title: "En el segundo cuatro, la persona cierra la pestaña"
      text: "El navegador ya no está. En un proceso en cola el agente sigue ejecutándose.\nCada llamada al modelo que queda se factura."
      note: "En un flujo de trabajo multiagente eso es una cantidad considerable de dinero gastada en una salida que nadie leerá jamás. En una respuesta transmitida ocurre lo contrario: la ejecución se corta a mitad de turno. A volumen bajo ambas son invisibles. A escala la primera es una partida de gasto y la segunda un ticket de soporte."
      notes: |
        Pregunta a la sala quién lo había pensado. Casi nadie.
        El encuadre que se queda: no estás pagando por una petición fallida, estás
        pagando íntegra una petición exitosa que ningún ser humano verá.

    - layout: code
      kicker: "Qué hace una desconexión a una respuesta transmitida"
      title: "`ignore_user_abort(true)` da sentido a `connection_aborted()`"
      width: 9.4
      highlight: ["connection_aborted()"]
      code: |
        // The run now completes into the history even if the tab closes.
        \ignore_user_abort(true);

        return response()->stream(function () use ($stream) {
            foreach ($stream as $chunk) {
                if (! $chunk instanceof TextChunk || \connection_aborted()) {
                    continue;   // nobody is reading: keep pulling, stop writing
                }

                echo 'data: ' . \json_encode(['content' => $chunk->content]) . "\n\n";
                \flush();
            }
        }, 200, $headers);
      side_notes:
        - "Con el `ignore_user_abort=0` por defecto de PHP, PHP termina el script en la primera escritura tras la desconexión: una comprobación `connection_aborted()` al inicio del bucle nunca se alcanza."
        - "El motor registra la ejecución como **fallida** al instante, así que el hilo no queda bloqueado — pero la respuesta se pierde. `ignore_user_abort(true)` la conserva: el bucle sigue consumiendo y deja de escribir."
      notes: |
        El detalle que importa: por defecto tu bucle nunca se entera de que el
        cliente se fue. PHP lo descubre en la primera escritura tras la desconexión
        y termina el script ahí, así que nada después de ese echo se ejecuta — ni
        comprobación ni evento done. Solo con ignore_user_abort(true) el script
        sobrevive a la escritura fallida, y solo entonces connection_aborted() lo
        informa desde la siguiente iteración. Cambia continue por break y vuelves al
        comportamiento por defecto, por elección. La otra forma de conservar la
        respuesta es una ejecución en cola, que ningún navegador puede interrumpir.
        Enuncia con honestidad la advertencia en la diapositiva siguiente — no dejes
        que piensen que esto elimina el coste.

    - layout: lead
      kicker: "Una advertencia honesta"
      title: "Estás limitando el daño, no eliminándolo"
      text: "Terminar la ejecución detiene lo que aún no ha ocurrido.\nLos tokens ya generados se facturan."
      note: "Por eso son las salvaguardas de presupuesto, y no la gestión de la desconexión, las que realmente acotan la exposición."
      notes: |
        Sé preciso aquí. Quien confíe demasiado en esta técnica dará el problema por
        resuelto y se saltará la salvaguarda de presupuesto, que es el control que
        de verdad acota el coste.

    - layout: lead
      kicker: "El efecto secundario que nadie espera"
      title: "El siguiente mensaje puede fallar"
      text: "Un turno cortado tras un paso de herramienta ya ha guardado la pregunta de la persona.\nEl siguiente `chat()` o `stream()` lanza `ChatHistoryException: Invalid message sequence`."
      note: "Llama a `recoverFailedTurn()` antes de cada turno: termina la ejecución fallida a partir de sus pasos registrados — una herramienta que ya se ejecutó no se vuelve a ejecutar — y la nueva pregunta sigue una conversación válida. No es gratis: cada pregunta abandonada cuesta una llamada al modelo para una respuesta que nadie esperó."
      notes: |
        La ejecución fallida en sí es inofensiva: el siguiente turno la sustituye.
        Lo que importa es lo que el turno fallido ya había guardado. Si el cliente
        se fue antes de que empezara la primera respuesta, no se guardó nada y el
        siguiente mensaje simplemente se responde; si se fue tras un paso de
        herramienta, la pregunta ya está en el historial y un segundo mensaje de
        usuario justo después no es una conversación válida.
        Por eso todos los puntos de conexión de este módulo llaman a
        recoverFailedTurn() antes de empezar un turno. Un caso que no ve: un proceso
        matado de golpe no ejecuta ningún destructor y no registra nada; su
        ejecución sigue en curso hasta que expira el arrendamiento.

    - layout: code
      kicker: "Para flujos de trabajo en cola"
      title: "Cancelación explícita, no deducida de la desconexión"
      width: 9.0
      highlight: ["Cache::has(\"workflow:{$state->getWorkflowId()}:cancelled\")"]
      code: |
        class ReviewNode extends Node
        {
            public function __invoke(DraftReady $event, WorkflowState $state): DraftReviewed|StopEvent
            {
                if (Cache::has("workflow:{$state->getWorkflowId()}:cancelled")) {
                    $state->set('cancelled', true);

                    return new StopEvent();
                }

                // ... the review itself, as in Chapter 14
            }
        }

        // A cancel endpoint
        Cache::put("workflow:{$id}:cancelled", true, now()->addHour());
      side_notes:
        - "Un navegador desconectado **no** debe detener un proceso en cola — la persona puede volver, y el resultado merece la pena."
        - "Un proceso que corre con un canal no tiene bucle del que salir, así que la comprobación va dentro del flujo: las primeras líneas de cualquier nodo que inicie un paso costoso."
        - "La cancelación es una decisión que toma quien usa la aplicación, no una inferencia que sacas de una pestaña cerrada."
      notes: |
        La distinción entre las dos diapositivas importa: para una respuesta
        transmitida, la desconexión es buena señal. Para un flujo en cola es mala
        señal, porque el sentido de la cola era precisamente que nadie estuviera
        esperando.
        Quien aplique la técnica de transmisión a un proceso en cola cancelará
        trabajo que sus usuarios querían.

    - layout: code
      kicker: "Salvaguardas de presupuesto"
      title: "El control que de verdad acota la exposición"
      width: 9.4
      highlight: ["abort(429"]
      code: |
        class BudgetMiddleware
        {
            public function handle($request, Closure $next)
            {
                $spent = Cache::get(
                    "ai_spend:{$request->user()->id}:" . today()->toDateString(), 0
                );

                if ($spent > config('neuron.daily_user_budget')) {
                    abort(429, 'Daily AI usage limit reached.');
                }

                return $next($request);
            }
        }
      side_notes:
        - "Registra el uso real a partir de los recuentos de tokens de cada inferencia — la Lección 23.1 suscribe un listener que hace exactamente esto."
        - "La Lección 1.3 decía que capturaras el uso desde el primer prototipo. Para esto era."
      notes: |
        Cierra explícitamente el círculo con la Lección 1.3. Registraron el bloque
        de uso hace veinte módulos por fe; esta es la recompensa.
        Fíjate en que es un tope diario por persona. La Lección 23.1 añade
        presupuestos por inquilino y globales — tres capas, porque un solo usuario
        desbocado y una sola funcionalidad desbocada son fallos distintos.

    - layout: takeaways
      items:
        - "Una pestaña cerrada no detiene una ejecución en cola — sigues pagando — y corta a mitad de turno una transmitida."
        - "`ignore_user_abort(true)`, o una ejecución en cola, conserva la respuesta; `connection_aborted()` solo significa algo con él."
        - "Un turno fallido que guardó su pregunta bloquea el siguiente: `recoverFailedTurn()` antes de cada turno."
        - "El trabajo en cola debe cancelarse explícitamente, entre pasos, no deducirse."
        - "Los presupuestos diarios por persona acotan la exposición; necesitan los recuentos de tokens que ya registras."
      notes: |
        El módulo siguiente convierte los flujos de trabajo en pausa en estado
        normal de la aplicación, con un estado, un responsable y un plazo.

closing:
  - layout: handson
    kicker: "Módulo 21 · Práctica"
    title: "Cinco lecciones con el teclado, un lab"
    lessons_title: "Con el teclado"
    lessons:
      - {id: "21.1", title: "Server-Sent Events en Laravel", duration: "13 min"}
      - {id: "21.2", title: "El problema del almacenamiento en búfer", duration: "12 min"}
      - {id: "21.3", title: "Transmitir con Livewire", duration: "12 min"}
      - {id: "21.4", title: "Frontends SPA y adaptadores de protocolo", duration: "12 min"}
      - {id: "21.5", title: "Transmitir desde una cola", duration: "13 min"}
    build_kicker: "Construirás"
    build_title: "Lab 15 — Una interfaz de chat con transmisión"
    build: "Respuestas token a token en el navegador, con un indicador que muestra qué herramienta está usando el agente. La 21.2 es la lección que salva el día: el búfer es la razón por la que la transmisión funciona en local y muere detrás de nginx."
    repo_kicker: "Código"
    repo: "hidran/neuronai-php-book"
    repo_note: "El repositorio cubre las Partes II–IV; la Parte V se construye dentro de tu propia app Laravel."
    notes: |
      Avísales de la 21.2 antes de que la depuren a medianoche. Todas las
      capas entre PHP y el navegador quieren almacenar en búfer, y cada una
      hay que desactivarla explícitamente.
  - layout: outro
    kicker: "Fin del Módulo 21"
    title: "Siguiente: Flujos de trabajo y\naprobación humana en producción"
    note: "Módulo 22 — el ciclo de vida de la aprobación como estado normal de la aplicación: un estado, un responsable, un plazo, una página de listado, una política y un registro de auditoría."
    notes: |
      Adelanta el replanteamiento: el humano en el bucle deja de ser una función
      de IA y pasa a ser una función de flujo de trabajo de tu aplicación.
