deck:
  title: "IA agéntica en PHP con NeuronAI"
  module: "Módulo 18"
  subtitle: "Los agentes como ciudadanos de primera clase"

slides:
  - layout: cover
    kicker: "Módulo 18 · Parte V — Laravel"
    title: "Aislamiento\nMultiinquilino"
    subtitle: "Cuatro puntos de fuga, un principio, y una prueba con un identificador que colisiona a propósito."
    meta: "IA agéntica en PHP con NeuronAI · Hidran Arias"
    notes: |
      Estas diapositivas cubren la lección teórica del Módulo 18. El resto es
      práctico — inyección de dependencias, almacén de mensajes con Eloquent,
      persistencia de flujos de trabajo.
      El argumento central generaliza mucho más allá de NeuronAI, y más allá de
      Laravel: el código agéntico corre fuera del ciclo de petición más a menudo
      que el código de aplicación normal, así que el contexto ambiental no es
      fiable.

  - layout: agenda
    kicker: "Módulo 18 · lección teórica"
    title: "Mantén separados a los inquilinos en cada componente con estado"
    items:
      - {id: "18.3", title: "Aislamiento multiinquilino", note: "Cuatro puntos de fuga y cómo cerrarlos"}
    notes: |
      Si se llevan una sola prueba de este curso a su propio código, es la del
      final de esta lección.

lessons:
# ═══════════════════════════════════════════════════════ 18.3
- id: "18.3"
  title: "Aislamiento multiinquilino"
  duration: "12 minutos"
  type: "Teoría con código"
  notes: |
    Una lección de seguridad disfrazada de lección de arquitectura. Enumera pronto
    los cuatro puntos de fuga — la lista es lo que se recuerda.
  slides:
    - layout: objectives
      text: "Mantener separados a los inquilinos en cada componente con estado de un sistema agéntico."
      notes: |
        Recalca "cada componente con estado". Casi todos los equipos protegen uno
        o dos y dan por hecho que el resto está cubierto.

    - layout: cards
      kicker: "Los cuatro puntos de fuga"
      title: "Falla uno solo y tienes una brecha"
      columns: 4
      height: 2.9
      items:
        - {marker: "1", title: "Historial de chat", text: "`thread_id`", tone: danger}
        - {marker: "2", title: "Almacén vectorial", text: "El ámbito de recuperación — Lección 12.6", tone: danger}
        - {marker: "3", title: "Herramientas", text: "Los datos que consultan", tone: danger}
        - {marker: "4", title: "Persistencia de flujos", text: "El identificador del flujo", tone: danger}
      notes: |
        Enuméralos en pantalla y, si enseñas en directo, hazlos repetir. Cuatro es
        un número memorable, y la lista es la lección.
        Señala que el 2 y el 4 son los que se olvidan — el historial y las
        herramientas parecen obviamente sensibles; un almacén vectorial y un blob
        de flujo serializado no.

    - layout: code
      kicker: "Un agente consciente del inquilino"
      title: "El inquilino llega con el hilo"
      width: 9.4
      highlight: ["ThreadScope::of($this->getThreadId())", "new SearchOrdersTool($scope->tenantId)"]
      code: |
        class Conversation extends Model
        {
            /** Named on the server from three columns of this row, never from a request. */
            public function threadId(): string
            {
                return "t{$this->tenant_id}:u{$this->user_id}:c{$this->id}";
            }
        }

        class SupportAgent extends Agent
        {
            // messageStore() and contextWindow() as in Lesson 18.2

            protected function tools(): array
            {
                $scope = ThreadScope::of($this->getThreadId());

                return [
                    // The tools receive the tenant — they cannot query outside it
                    new SearchOrdersTool($scope->tenantId),
                    new GetOrderStatusTool($scope->tenantId),
                ];
            }
        }
      notes: |
        Señala el nombre compuesto del hilo — inquilino, usuario y conversación
        juntos, compuesto en el servidor a partir de una fila, nunca desde la
        petición. Un identificador de conversación a secas es el fallo que atrapa la
        prueba del final de esta lección.
        Luego señala las herramientas: reciben el ID del inquilino derivado del hilo
        al que está ligado el agente — no de auth(), no de un argumento del
        constructor — así que no hay camino de código en el que consulten sin un
        ámbito. Un hilo que no lleva las tres partes se rechaza antes de que exista
        una sola herramienta.
        Para un agente el hilo es también el ID de flujo, así que historial y
        ejecución persistida comparten ámbito: si el hilo es correcto, ambos lo son.

    - layout: lead
      kicker: "El principio"
      title: "Delimita en la construcción, no en el momento de consultar"
      text: "No hay camino de código en el que una herramienta consulte sin ámbito de inquilino,\nporque no tiene manera de hacerlo."
      note: "Compáralo con la alternativa — una herramienta que lee el inquilino actual de una variable global o de una fachada dentro de `__invoke()`. Funciona hasta que algo corre fuera de una petición."
      notes: |
        Es el argumento central de la lección. Dilo, y justifícalo en la
        diapositiva siguiente.
        La distinción es entre "la herramienta tiene cuidado" y "la herramienta no
        puede descuidarse". Solo la segunda sobrevive al contacto con un proceso en
        cola.

    - layout: cards
      kicker: "Por qué el contexto ambiental falla precisamente aquí"
      title: "El código agéntico corre fuera del ciclo de petición más a menudo que el código de aplicación normal"
      columns: 3
      height: 2.9
      items:
        - {marker: "1", title: "Procesos en cola", text: "Lección 16.4 — las ejecuciones largas van en cola, y una cola no tiene petición.", tone: warn}
        - {marker: "2", title: "Flujos reanudados", text: "Lección 15.4 — reanudados horas o días después, en otro proceso distinto.", tone: warn}
        - {marker: "3", title: "Ingesta programada", text: "Módulo 20 — un comando de cron sin usuario y sin sesión.", tone: warn}
      notes: |
        Tres casos concretos, que ya han construido o construirán en este curso. En
        los tres la variable global está vacía o — peor — contiene el inquilino
        equivocado de un trabajo anterior en el mismo proceso.
        Ese último fallo es el peligroso, porque no lanza excepción. Devuelve datos
        de otro inquilino.
        Di la generalización: este argumento vale mucho más allá de NeuronAI. Pasa
        el contexto explícitamente allí donde el código pueda correr fuera del
        ciclo de petición.

    - layout: code
      kicker: "Identificadores de flujo"
      title: "Ponles prefijo también"
      width: 7.6
      highlight: ["t{$this->tenant->id}"]
      code: |
        class RefundWorkflow extends Workflow
        {
            public function __construct(
                private readonly Tenant $tenant,
                private readonly Order $order,
            ) {
                parent::__construct();
            }

            public function workflowId(): ?string
            {
                return "t{$this->tenant->id}:refund:{$this->order->id}";
            }
        }
      side_notes:
        - "El ID de flujo de un agente llega gratis con su hilo; tus propios flujos declaran el suyo sobrescribiendo `workflowId()`."
        - "Con prefijo de inquilino, así un flujo reanudado no puede confundirse con el de otro inquilino — y con clave de negocio, así una petición posterior que solo tiene inquilino y pedido encuentra la ejecución en pausa."
        - "Y así puedes consultar las interrupciones pendientes por inquilino — algo que la pantalla de aprobación del Módulo 22 necesita."
      notes: |
        Una diapositiva de una línea, pero cierra el punto de fuga 4. La segunda
        nota lateral es la recompensa práctica: sin el prefijo, "muéstrame las
        aprobaciones pendientes de este inquilino" no es una consulta que puedas
        escribir.

    - layout: code
      kicker: "Probar el aislamiento"
      title: "Fíjate en el montaje deliberadamente hostil: los *mismos* números de usuario y conversación"
      width: 9.6
      highlight: ["assertSent"]
      code: |
        public function test_tenant_a_history_never_reaches_tenant_b(): void
        {
            // The hostile part: both tenants hold user 3 and conversation 7
            $a = (new Conversation())->forceFill(['id' => 7, 'tenant_id' => 1, 'user_id' => 3]);
            $b = (new Conversation())->forceFill(['id' => 7, 'tenant_id' => 2, 'user_id' => 3]);

            $modelA = new FakeAIProvider(new AssistantMessage('Noted.'));
            $modelB = new FakeAIProvider(new AssistantMessage('I do not know.'));

            app(SupportAgent::class)->setAiProvider($modelA)
                ->for($a->threadId())
                ->chat(new UserMessage('My secret code is ALPHA'));

            app(SupportAgent::class)->setAiProvider($modelB)
                ->for($b->threadId())
                ->chat(new UserMessage('What is my secret code?'));

            // Assert on what tenant B's model was sent, not on what a model might answer
            $modelB->assertCallCount(1);
            $modelB->assertSent(fn (RequestRecord $request): bool =>
                ! str_contains(json_encode($request->messages), 'ALPHA'));
        }
      notes: |
        Muéstralo ante la cámara y explica la hostilidad del montaje: los dos
        inquilinos tienen LOS MISMOS números de usuario y de conversación. Si falta el
        prefijo de inquilino en el nombre del hilo, esta prueba falla — que es
        exactamente lo que quieres que atrape.
        Una prueba que usa números distintos pasa funcione o no el aislamiento, lo
        que la hace peor que no tener prueba.
        Fíjate también en qué afirma. FakeAIProvider registra cada petición, así que
        la prueba inspecciona los mensajes que llegaron al modelo del inquilino B en
        vez de esperar que un modelo real repita el secreto. No se llama a ningún
        modelo, el resultado es el mismo en cada ejecución, y la prueba puede servir
        de puerta de despliegue — según la lista del Módulo 23.

    - layout: takeaways
      items:
        - "Cuatro puntos de fuga: historial, almacén vectorial, herramientas, persistencia de flujos — para un agente, el hilo cubre el primero y el último."
        - "Delimita en la construcción; no leas contexto ambiental dentro de las herramientas."
        - "Declara IDs de flujo con clave de negocio y prefijo de inquilino mediante `workflowId()`."
        - "El código agéntico corre a menudo fuera del ciclo de petición — allí las variables globales no son fiables."
        - "Escribe una prueba de aislamiento con un identificador que colisione, y afirma sobre lo que se envió al modelo."
      notes: |
        El punto 4 es el accionable. Son diez líneas y cierran toda una categoría
        de brecha.

closing:
