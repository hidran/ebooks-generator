  - layout: agenda
    kicker: "Modulo 21 · lezione teorica"
    title: "Smetti di pagare per lavoro che nessuno aspetta"
    items:
      - {id: "21.6", title: "Disconnessione e costo orfano", note: "Rilevarlo, annullarlo, limitarlo"}
