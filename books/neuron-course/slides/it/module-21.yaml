lessons:
# ═══════════════════════════════════════════════════════ 21.6
- id: "21.6"
  title: "Disconnessione e costo orfano"
  duration: "9 minuti"
  type: "Teoria con codice"
  notes: |
    Una lezione sui costi che nessuno si aspetta. Apri con lo scenario prima di
    qualsiasi codice — è immediatamente riconoscibile e leggermente allarmante,
    che è la reazione giusta.
  slides:
    - layout: objectives
      text: "Smettere di pagare per lavoro che nessuno sta aspettando."
      notes: |
        Una frase, ed è tutta la lezione. Dilla e passa subito allo scenario.

    - layout: lead
      kicker: "Il problema di cui nessuno parla"
      title: "Al quarto secondo, l'utente chiude la scheda"
      text: "Il browser non c'è più. Su un worker in coda l'agent continua a girare.\nOgni chiamata al modello rimanente viene fatturata."
      note: "In un workflow multi-agente è una quantità di denaro consistente spesa per un output che nessuno leggerà mai. In una risposta in streaming accade l'opposto: la run viene interrotta a metà turno. A basso volume entrambe sono invisibili. Su scala la prima è una voce di bilancio e la seconda un ticket di supporto."
      notes: |
        Chiedi alla sala chi ci ha pensato. Quasi nessuno.
        L'inquadratura che fa presa: non stai pagando per una richiesta fallita,
        stai pagando per intero una richiesta riuscita che nessun essere umano
        vedrà mai.

    - layout: code
      kicker: "Cosa fa una disconnessione a una risposta in streaming"
      title: "`ignore_user_abort(true)` dà senso a `connection_aborted()`"
      width: 9.4
      highlight: ["connection_aborted()"]
      code: |
        // The run now completes into the history even if the tab closes.
        \ignore_user_abort(true);

        return response()->stream(function () use ($stream) {
            foreach ($stream as $chunk) {
                if (! $chunk instanceof TextChunk || \connection_aborted()) {
                    continue;   // nobody is reading: keep pulling, stop writing
                }

                echo 'data: ' . \json_encode(['content' => $chunk->content]) . "\n\n";
                \flush();
            }
        }, 200, $headers);
      side_notes:
        - "Con il `ignore_user_abort=0` di default di PHP, PHP termina lo script alla prima scrittura dopo la disconnessione: un controllo `connection_aborted()` in cima al ciclo non viene mai raggiunto."
        - "Il motore registra la run come **fallita** subito, quindi il thread non resta bloccato — ma la risposta è persa. `ignore_user_abort(true)` la salva: il ciclo continua a consumare e smette di scrivere."
      notes: |
        Il dettaglio che conta: di default il tuo ciclo non viene mai a sapere che il
        client se n'è andato. PHP lo scopre alla prima scrittura dopo la
        disconnessione e termina lo script lì, quindi nulla dopo quell'echo gira —
        né controlli né evento done. Solo con ignore_user_abort(true) lo script
        sopravvive alla scrittura fallita, e solo allora connection_aborted() lo
        segnala dall'iterazione successiva. Sostituisci continue con break e torni al
        comportamento di default, per scelta. L'altro modo per tenere la risposta è
        una run in coda, che nessun browser può interrompere.
        Enuncia onestamente l'avvertenza nella slide successiva — non far pensare
        agli studenti che questo elimini il costo.

    - layout: lead
      kicker: "Un'avvertenza onesta"
      title: "Stai limitando il danno, non eliminandolo"
      text: "Terminare la run ferma ciò che non è ancora successo.\nI token già generati vengono fatturati."
      note: "Ecco perché sono i budget guard, e non la gestione della disconnessione, a limitare davvero l'esposizione."
      notes: |
        Sii preciso qui. Chi si fida troppo di questa tecnica darà per risolto il
        problema e salterà il budget guard, che è il controllo che davvero limita
        il costo.

    - layout: lead
      kicker: "L'effetto collaterale che nessuno si aspetta"
      title: "Il messaggio successivo può fallire"
      text: "Un turno interrotto dopo un passo di tool ha già salvato la domanda dell'utente.\nIl `chat()` o `stream()` successivo lancia `ChatHistoryException: Invalid message sequence`."
      note: "Chiama `recoverFailedTurn()` prima di ogni turno: porta a termine la run fallita dai suoi step registrati — un tool già eseguito non viene rieseguito — così la nuova domanda segue una conversazione valida. Non è gratis: ogni domanda abbandonata costa una chiamata al modello per una risposta che nessuno ha aspettato."
      notes: |
        La run fallita in sé è innocua: il turno successivo la sostituisce. Conta ciò
        che il turno fallito aveva già salvato. Se il client se n'è andato prima
        che iniziasse la prima risposta, non è stato salvato nulla e il messaggio
        successivo riceve semplicemente risposta; se se n'è andato dopo un passo di
        tool, la domanda è già nella cronologia e un secondo messaggio utente subito
        dopo non è una conversazione valida.
        Per questo ogni endpoint di questo modulo chiama recoverFailedTurn() prima
        di iniziare un turno. Un caso che non vede: un processo ucciso di netto non
        esegue alcun distruttore e non registra nulla; la sua run resta in
        esecuzione finché il lease non scade.

    - layout: code
      kicker: "Per i workflow in coda"
      title: "Annullamento esplicito, non dedotto dalla disconnessione"
      width: 9.0
      highlight: ["Cache::has(\"workflow:{$state->getWorkflowId()}:cancelled\")"]
      code: |
        class ReviewNode extends Node
        {
            public function __invoke(DraftReady $event, WorkflowState $state): DraftReviewed|StopEvent
            {
                if (Cache::has("workflow:{$state->getWorkflowId()}:cancelled")) {
                    $state->set('cancelled', true);

                    return new StopEvent();
                }

                // ... the review itself, as in Chapter 14
            }
        }

        // A cancel endpoint
        Cache::put("workflow:{$id}:cancelled", true, now()->addHour());
      side_notes:
        - "Un browser disconnesso **non** deve fermare un worker — l'utente potrebbe tornare, e il risultato vale la pena averlo."
        - "Un worker che gira con un channel non ha un ciclo da cui uscire, quindi il controllo sta dentro il workflow: le prime righe di ogni nodo che avvia un passo costoso."
        - "L'annullamento è una decisione che prende l'utente, non un'inferenza che tiri tu da una scheda chiusa."
      notes: |
        La distinzione tra le due slide conta: per una risposta in streaming la
        disconnessione è un buon segnale. Per un workflow in coda è un pessimo
        segnale, perché il senso della coda era proprio che nessuno stia aspettando.
        Chi applica la tecnica dello streaming a un worker annullerà lavoro che gli
        utenti volevano.

    - layout: code
      kicker: "Budget guard"
      title: "Il controllo che davvero limita l'esposizione"
      width: 9.4
      highlight: ["abort(429"]
      code: |
        class BudgetMiddleware
        {
            public function handle($request, Closure $next)
            {
                $spent = Cache::get(
                    "ai_spend:{$request->user()->id}:" . today()->toDateString(), 0
                );

                if ($spent > config('neuron.daily_user_budget')) {
                    abort(429, 'Daily AI usage limit reached.');
                }

                return $next($request);
            }
        }
      side_notes:
        - "Registra l'uso effettivo dai conteggi di token di ogni inferenza — la Lezione 23.1 sottoscrive un listener che fa esattamente questo."
        - "La Lezione 1.3 diceva di catturare l'usage dal primo prototipo. Ecco a cosa serviva."
      notes: |
        Chiudi esplicitamente il cerchio sulla Lezione 1.3. Gli studenti hanno
        registrato il blocco usage venti moduli fa sulla fiducia; questo è il
        pagamento.
        Nota che questo è un tetto giornaliero per utente. La Lezione 23.1 aggiunge
        budget per tenant e globali — tre livelli, perché un singolo utente
        impazzito e una singola funzionalità impazzita sono guasti diversi.

    - layout: takeaways
      items:
        - "Una scheda chiusa non ferma una run in coda — continui a pagare — e interrompe a metà turno una in streaming."
        - "`ignore_user_abort(true)`, o una run in coda, conserva la risposta; `connection_aborted()` significa qualcosa solo con esso."
        - "Un turno fallito che aveva salvato la sua domanda blocca il successivo: `recoverFailedTurn()` prima di ogni turno."
        - "Il lavoro in coda va annullato esplicitamente, tra un passo e l'altro, non dedotto."
        - "I budget giornalieri per utente limitano l'esposizione; hanno bisogno dei conteggi di token che stai già registrando."
      notes: |
        Il modulo successivo trasforma i workflow in pausa in normale stato
        applicativo, con uno stato, un proprietario e una scadenza.

