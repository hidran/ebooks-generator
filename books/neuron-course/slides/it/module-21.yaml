    subtitle: "Una scheda chiusa non ferma un agent. Tu continui a pagare."
    meta: "Agentic AI in PHP con NeuronAI · Hidran Arias"
    notes: |
      Queste slide coprono la lezione teorica del Modulo 21. Il resto è pratico —
