deck:
  title: "Agentic AI in PHP con NeuronAI"
  module: "Modulo 17"
  subtitle: "L'SDK per Laravel"

slides:
  - layout: cover
    kicker: "Modulo 17 · Parte V — Laravel"
    title: "L'SDK per Laravel"
    subtitle: "Una facade sicura rispetto alla concorrenza, e le linee guida che impediscono al tuo assistente di scrivere codice v2."
    meta: "Agentic AI in PHP con NeuronAI · Hidran Arias"
    notes: |
      Si apre la Parte V. La maggior parte del Modulo 17 è pratica — installazione,
      configurazione, facade, dependency injection. Queste due lezioni sono quelle
      concettuali.
      Tieni presente l'inquadratura della Lezione 2.5 per tutta la Parte V: l'SDK
      aggiunge comodità, non capacità.

  - layout: agenda
    kicker: "Modulo 17 · lezioni teoriche"
    title: "Due cose da capire prima di usare la facade"
    items:
      - {id: "17.5", title: "Copiare, non mutare", note: "La storia della concorrenza della facade"}
