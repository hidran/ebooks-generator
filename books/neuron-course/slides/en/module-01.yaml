deck:
  title: "Agentic AI in PHP with NeuronAI"
  module: "Module 1"
  subtitle: "What \"agentic\" actually means"

slides:
  - layout: cover
    kicker: "Module 1 · Part I — Foundations"
    title: "What \"Agentic\"\nActually Means"
    subtitle: "The autonomy ladder, the agent loop, and the arithmetic that decides your architecture."
    meta: "Agentic AI in PHP with NeuronAI · Hidran Arias"

  - layout: agenda
    kicker: "Module 1"
    title: "Seven lessons, one question"
    items:
      - {id: "1.1", title: "The Autonomy Ladder", note: "LLM, chatbot, workflow, agent"}
      - {id: "1.2", title: "The Agent Loop", note: "What is actually being automated"}
      - {id: "1.3", title: "Anatomy of a Model Call", note: "What is on the wire"}
