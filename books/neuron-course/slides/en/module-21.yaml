deck:
  title: "Agentic AI in PHP with NeuronAI"
  module: "Module 21"
  subtitle: "Streaming to the frontend"

slides:
  - layout: cover
    kicker: "Module 21 · Part V — Laravel"
    title: "Disconnection and\nOrphaned Cost"
    subtitle: "A closed tab does not stop a queued agent. You keep paying."
    meta: "Agentic AI in PHP with NeuronAI · Hidran Arias"
    notes: |
      This deck covers Module 21's theory lesson. The rest is hands-on — SSE
      endpoints, Livewire, broadcasting, queued streaming.
      This lesson is short and unusually practical: it is money students are
      currently losing without knowing it.

  - layout: agenda
    kicker: "Module 21 · theory lesson"
    title: "Stop paying for work nobody is waiting for"
    items:
      - {id: "21.6", title: "Disconnection and Orphaned Cost", note: "Detect it, cancel it, cap it"}
    notes: |
      Nine minutes. The value is disproportionate to the length — most teams
      have never considered this failure at all.

lessons:
# ═══════════════════════════════════════════════════════ 21.6
- id: "21.6"
  title: "Disconnection and Orphaned Cost"
  duration: "9 minutes"
  type: "Theory with code"
  notes: |
    A cost lesson nobody expects. Open with the scenario before any code — it
    is immediately recognisable and slightly alarming, which is the right
    reaction.
  slides:
    - layout: objectives
      text: "Stop paying for work nobody is waiting for."
      notes: |
        One sentence, and it is the whole lesson. Say it and go straight to the
        scenario.

    - layout: lead
      kicker: "The problem nobody mentions"
      title: "At second four, the user closes the tab"
      text: "The browser is gone. On a queue worker the agent keeps running.\nEvery remaining model call is billed."
      note: "In a multi-agent workflow that is a substantial amount of money spent on output nobody will ever read. In a streamed response the opposite happens: the run is cut off in mid-turn. At low volume both are invisible. At scale the first is a line item and the second is a support ticket."
      notes: |
        Ask the room who has considered this. Almost nobody has.
        The framing that makes it stick: you are not paying for a failed
        request, you are paying in full for a successful one that no human will
        ever see.

    - layout: code
      kicker: "What a disconnect does to a streamed response"
      title: "`ignore_user_abort(true)` makes `connection_aborted()` meaningful"
      width: 9.4
      highlight: ["connection_aborted()"]
      code: |
        // The run now completes into the history even if the tab closes.
        \ignore_user_abort(true);

        return response()->stream(function () use ($stream) {
            foreach ($stream as $chunk) {
                if (! $chunk instanceof TextChunk || \connection_aborted()) {
                    continue;   // nobody is reading: keep pulling, stop writing
                }

                echo 'data: ' . \json_encode(['content' => $chunk->content]) . "\n\n";
                \flush();
            }
        }, 200, $headers);
      side_notes:
        - "With PHP's default `ignore_user_abort=0`, PHP ends the script on the first write after the disconnect: a `connection_aborted()` check at the top of the loop is never reached."
        - "The engine records the run as **failed** at once, so the thread is not locked — but the answer is lost. `ignore_user_abort(true)` keeps it: the loop keeps pulling and stops writing."
      notes: |
        The detail that matters: by default your loop never learns the client has
        gone. PHP learns it on the first write after the disconnect and terminates
        the script there, so nothing after that echo runs — no check, no done event.
        Only with ignore_user_abort(true) does the script survive the failed write,
        and only then does connection_aborted() report it from the next iteration.
        Replace continue with break and you are back to the default behaviour, by
        choice. The other way to keep the answer is a queued run, which no browser
        can interrupt.
        State the caveat honestly on the next slide — do not let students think
        this eliminates the cost.

    - layout: lead
      kicker: "One honest caveat"
      title: "You are limiting the damage, not eliminating it"
      text: "Ending the run stops what has not happened yet.\nThe tokens already generated are billed."
      note: "Which is why budget guards, not disconnection handling, are what actually cap exposure."
      notes: |
        Be precise here. Students who over-trust this will assume the problem is
        solved and skip the budget guard, which is the control that actually
        bounds the cost.

    - layout: lead
      kicker: "The side effect nobody expects"
      title: "The next message can fail"
      text: "A turn cut off after a tool step has already stored the user's question.\nThe next `chat()` or `stream()` throws `ChatHistoryException: Invalid message sequence`."
      note: "Call `recoverFailedTurn()` before every turn: it finishes the failed run from its committed steps — a tool that already ran is not run again — so the new question follows a valid conversation. It is not free: each abandoned question costs a model call for an answer nobody waited for."
      notes: |
        The failed run itself is harmless: the next turn replaces it. What matters is
        what the failed turn had already stored. If the client left before the
        first answer began, nothing was stored and the next message is simply
        answered; if it left after a tool step, the question is already in the
        history and a second user message straight after it is not a valid
        conversation.
        That is why every endpoint in this chapter calls recoverFailedTurn()
        before starting a turn. One case it cannot see: a process killed outright
        runs no destructor and records nothing; its run stays running until the
        lease expires.

    - layout: code
      kicker: "For queued workflows"
      title: "Explicit cancellation, not inferred from disconnection"
      width: 9.0
      highlight: ["Cache::has(\"workflow:{$state->getWorkflowId()}:cancelled\")"]
      code: |
        class ReviewNode extends Node
        {
            public function __invoke(DraftReady $event, WorkflowState $state): DraftReviewed|StopEvent
            {
                if (Cache::has("workflow:{$state->getWorkflowId()}:cancelled")) {
                    $state->set('cancelled', true);

                    return new StopEvent();
                }

                // ... the review itself, as in Chapter 14
            }
        }

        // A cancel endpoint
        Cache::put("workflow:{$id}:cancelled", true, now()->addHour());
      side_notes:
        - "A disconnected browser does **not** stop a worker — the user may come back, and the result is worth having."
        - "A worker running with a channel has no loop to break out of, so the check belongs inside the workflow: the first lines of any node that starts an expensive step."
        - "Cancellation is a decision the user makes, not an inference you draw from a closed tab."
      notes: |
        The distinction between the two slides matters: for a streamed response,
        disconnection is a good signal. For a queued workflow it is a bad one,
        because the whole point of the queue was that nobody is waiting.
        Students who apply the streaming technique to a worker will cancel work
        their users wanted.

    - layout: code
      kicker: "Budget guards"
      title: "The control that actually caps exposure"
      width: 9.4
      highlight: ["abort(429"]
      code: |
        class BudgetMiddleware
        {
            public function handle($request, Closure $next)
            {
                $spent = Cache::get(
                    "ai_spend:{$request->user()->id}:" . today()->toDateString(), 0
                );

                if ($spent > config('neuron.daily_user_budget')) {
                    abort(429, 'Daily AI usage limit reached.');
                }

                return $next($request);
            }
        }
      side_notes:
        - "Record actual usage from each inference's token counts — Lesson 23.1 subscribes a listener that does exactly this."
        - "Lesson 1.3 said capture usage from the first prototype. This is what you capture it for."
      notes: |
        Close the loop on Lesson 1.3 explicitly. Students logged the usage block
        twenty modules ago on faith; this is the payoff.
        Note that this is a per-user daily cap. Lesson 23.1 adds per-tenant and
        global budgets — three layers, because a single runaway user and a
        single runaway feature are different failures.

    - layout: takeaways
      items:
        - "A closed tab does not stop a queued run — you keep paying — and it cuts a streamed one off in mid-turn."
        - "`ignore_user_abort(true)`, or a queued run, keeps the answer; `connection_aborted()` only means something with it."
        - "A failed turn that stored its question blocks the next one: `recoverFailedTurn()` before every turn."
        - "Queued work should be cancelled explicitly, between steps, not inferred."
        - "Per-user daily budgets cap exposure; they need the token counts you have been logging."
      notes: |
        Next module turns paused workflows into ordinary application state, with
        a status, an owner and a deadline.

closing:
  - layout: handson
    kicker: "Module 21 · Hands-on"
    title: "Five lessons at the keyboard, one lab"
    lessons_title: "At the keyboard"
    lessons:
      - {id: "21.1", title: "Server-Sent Events in Laravel", duration: "13 min"}
      - {id: "21.2", title: "The Buffering Problem", duration: "12 min"}
      - {id: "21.3", title: "Streaming with Livewire", duration: "12 min"}
      - {id: "21.4", title: "SPA Frontends and Protocol Adapters", duration: "12 min"}
      - {id: "21.5", title: "Streaming from a Queue", duration: "13 min"}
    build_kicker: "You'll build"
    build_title: "Lab 15 — A streaming chat interface"
    build: "Token-by-token responses in the browser, with an indicator showing which tool the agent is using. 21.2 is the lesson that saves the day: buffering is why streaming works locally and dies behind nginx."
    repo_kicker: "Code"
    repo: "hidran/neuronai-php-book"
    repo_note: "The repo covers Parts II–IV; Part V is built inside your own Laravel app."
    notes: |
      Warn them about 21.2 before they debug it at midnight. Every layer
      between PHP and the browser wants to buffer, and each one needs turning
      off explicitly.
  - layout: outro
    kicker: "End of Module 21"
    title: "Next: Workflows and Human\nApproval in Production"
    note: "Module 22 — the approval lifecycle as ordinary application state: a status, an owner, a deadline, an index page, a policy and an audit trail."
    notes: |
      Tease the reframing: human-in-the-loop stops being an AI feature and
      becomes a workflow feature of your application.
