deck:
  title: "Agentic AI in PHP with NeuronAI"
  module: "Module 18"
  subtitle: "Agents as first-class citizens"

slides:
  - layout: cover
    kicker: "Module 18 · Part V — Laravel"
    title: "Multi-Tenant\nIsolation"
    subtitle: "Four leak points, one principle, and a test with a deliberately colliding identifier."
    meta: "Agentic AI in PHP with NeuronAI · Hidran Arias"
    notes: |
      This deck covers Module 18's theory lesson. The rest is hands-on —
      dependency injection, the Eloquent message store, workflow persistence.
      The core argument generalises well beyond NeuronAI, and beyond Laravel:
      agentic code runs outside the request cycle more often than normal
      application code, so ambient context is unreliable.

  - layout: agenda
    kicker: "Module 18 · theory lesson"
    title: "Keep tenants apart across every stateful component"
    items:
      - {id: "18.3", title: "Multi-Tenant Isolation", note: "Four leak points and how to close them"}
    notes: |
      If students take one test from this course into their own codebase, it is
      the one at the end of this lesson.

lessons:
# ═══════════════════════════════════════════════════════ 18.3
- id: "18.3"
  title: "Multi-Tenant Isolation"
  duration: "12 minutes"
  type: "Theory with code"
  notes: |
    A security lesson disguised as an architecture lesson. Enumerate the four
    leak points early — students remember the list.
  slides:
    - layout: objectives
      text: "Keep tenants separate across every stateful component of an agentic system."
      notes: |
        Stress "every stateful component". Most teams protect one or two and
        assume the rest are covered.

    - layout: cards
      kicker: "The four leak points"
      title: "Miss any one and you have a breach"
      columns: 4
      height: 2.9
      items:
        - {marker: "1", title: "Chat history", text: "`thread_id`", tone: danger}
        - {marker: "2", title: "Vector store", text: "The retrieval scope — Lesson 12.6", tone: danger}
        - {marker: "3", title: "Tools", text: "The data they query", tone: danger}
        - {marker: "4", title: "Workflow persistence", text: "The workflow ID", tone: danger}
      notes: |
        Enumerate them on screen and make students say them back if you are
        teaching live. Four is a memorable number, and the list is the lesson.
        Point out that 2 and 4 are the ones people forget — history and tools
        feel obviously sensitive; a vector store and a serialised workflow blob
        do not.

    - layout: code
      kicker: "A tenant-aware agent"
      title: "The tenant arrives with the thread"
      width: 9.4
      highlight: ["ThreadScope::of($this->getThreadId())", "new SearchOrdersTool($scope->tenantId)"]
      code: |
        class Conversation extends Model
        {
            /** Named on the server from three columns of this row, never from a request. */
            public function threadId(): string
            {
                return "t{$this->tenant_id}:u{$this->user_id}:c{$this->id}";
            }
        }

        class SupportAgent extends Agent
        {
            // messageStore() and contextWindow() as in Lesson 18.2

            protected function tools(): array
            {
                $scope = ThreadScope::of($this->getThreadId());

                return [
                    // The tools receive the tenant — they cannot query outside it
                    new SearchOrdersTool($scope->tenantId),
                    new GetOrderStatusTool($scope->tenantId),
                ];
            }
        }
      notes: |
        Point at the composite thread name — tenant, user and conversation together,
        composed on the server from a row, never from the request. A bare
        conversation ID is the bug the test at the end of this lesson catches.
        Then point at the tools: they receive the tenant ID derived from the thread
        the agent is bound to — not from auth(), not from a constructor argument — so
        there is no code path where they query without a scope. A thread that does
        not carry all three parts is refused before a single tool exists.
        For an agent the thread is also the workflow ID, so history and persisted run
        are scoped together: get the thread right and both are right.

    - layout: lead
      kicker: "The principle"
      title: "Scope at construction, not at query time"
      text: "There is no code path where a tool queries without a tenant scope,\nbecause it has no way to."
      note: "Compare with the alternative — a tool that reads the current tenant from a global or a facade inside `__invoke()`. That works until something runs outside a request."
      notes: |
        This is the core argument of the lesson. Say it, then justify it on the
        next slide.
        The distinction is between "the tool is careful" and "the tool cannot be
        careless". Only the second survives contact with a queue worker.

    - layout: cards
      kicker: "Why ambient context fails here specifically"
      title: "Agentic code runs outside the request cycle more often than normal application code"
      columns: 3
      height: 2.9
      items:
        - {marker: "1", title: "Queue workers", text: "Lesson 16.4 — long runs belong on a queue, and a queue has no request.", tone: warn}
        - {marker: "2", title: "Resumed workflows", text: "Lesson 15.4 — resumed hours or days later, in a different process entirely.", tone: warn}
        - {marker: "3", title: "Scheduled ingestion", text: "Module 20 — a cron command with no user and no session.", tone: warn}
      notes: |
        Three concrete cases, all of which students have already built or will
        build in this course. In all three the global is empty or — worse —
        holds the wrong tenant from a previous job on the same worker.
        That last failure is the dangerous one, because it does not throw. It
        returns another tenant's data.
        Say the generalisation: this argument holds well beyond NeuronAI. Pass
        context explicitly wherever code may run off the request cycle.

    - layout: code
      kicker: "Workflow IDs"
      title: "Prefix them too"
      width: 7.6
      highlight: ["t{$this->tenant->id}"]
      code: |
        class RefundWorkflow extends Workflow
        {
            public function __construct(
                private readonly Tenant $tenant,
                private readonly Order $order,
            ) {
                parent::__construct();
            }

            public function workflowId(): ?string
            {
                return "t{$this->tenant->id}:refund:{$this->order->id}";
            }
        }
      side_notes:
        - "An agent's workflow ID comes free with its thread; your own workflows declare theirs by overriding `workflowId()`."
        - "Tenant-prefixed, so a resumed workflow cannot be confused with another tenant's — and business-keyed, so a later request holding only the tenant and the order finds the paused run."
        - "And so you can query pending interrupts per tenant — which the approval screen in Module 22 needs."
      notes: |
        A one-line slide, but it closes leak point 4. The second side note is
        the practical payoff: without the prefix, "show this tenant's pending
        approvals" is not a query you can write.

    - layout: code
      kicker: "Testing isolation"
      title: "Note the deliberately hostile setup: the *same* user and conversation numbers"
      width: 9.6
      highlight: ["assertSent"]
      code: |
        public function test_tenant_a_history_never_reaches_tenant_b(): void
        {
            // The hostile part: both tenants hold user 3 and conversation 7
            $a = (new Conversation())->forceFill(['id' => 7, 'tenant_id' => 1, 'user_id' => 3]);
            $b = (new Conversation())->forceFill(['id' => 7, 'tenant_id' => 2, 'user_id' => 3]);

            $modelA = new FakeAIProvider(new AssistantMessage('Noted.'));
            $modelB = new FakeAIProvider(new AssistantMessage('I do not know.'));

            app(SupportAgent::class)->setAiProvider($modelA)
                ->for($a->threadId())
                ->chat(new UserMessage('My secret code is ALPHA'));

            app(SupportAgent::class)->setAiProvider($modelB)
                ->for($b->threadId())
                ->chat(new UserMessage('What is my secret code?'));

            // Assert on what tenant B's model was sent, not on what a model might answer
            $modelB->assertCallCount(1);
            $modelB->assertSent(fn (RequestRecord $request): bool =>
                ! str_contains(json_encode($request->messages), 'ALPHA'));
        }
      notes: |
        Show this on camera and explain the hostility of the setup: both tenants hold
        the SAME user and conversation numbers. If the tenant prefix is missing from
        the thread name, this test fails — which is exactly what you want it to catch.
        A test that uses different numbers passes whether or not the isolation works,
        which makes it worse than no test at all.
        Note also what it asserts on. FakeAIProvider records every request, so the
        test inspects the messages that reached tenant B's model instead of hoping a
        live model would repeat the secret. No model is called, the result is the same
        on every run, and the test can gate a deploy — per the Module 23 checklist.

    - layout: takeaways
      items:
        - "Four leak points: history, vector store, tools, workflow persistence — for an agent, the thread covers the first and the last."
        - "Scope at construction; do not read ambient context inside tools."
        - "Declare business-keyed, tenant-prefixed workflow IDs with `workflowId()`."
        - "Agentic code runs outside the request cycle often — globals are unreliable there."
        - "Write an isolation test with a colliding identifier, and assert on what the model was sent."
      notes: |
        Takeaway 4 is the actionable one. It is ten lines and it gates a whole
        category of breach.

closing:
  - layout: handson
    kicker: "Module 18 · Hands-on"
    title: "Three lessons at the keyboard, one lab"
    lessons_title: "At the keyboard"
    lessons:
      - {id: "18.1", title: "Agents in the Container", duration: "13 min"}
      - {id: "18.2", title: "EloquentMessageStore", duration: "13 min"}
      - {id: "18.4", title: "Database Workflow Persistence", duration: "11 min"}
    build_kicker: "You'll build"
    build_title: "Lab 12 — Persistent per-user chat"
    build: "Chat for an authenticated user, with multiple threads and history in the database. The file-backed history from Lab 2 becomes something a real application can actually run."
    repo_kicker: "Code"
    repo: "hidran/neuronai-php-book"
    repo_note: "The repo covers Parts II–IV; Part V is built inside your own Laravel app."
    notes: |
      18.4 is the bridge to Module 22: once workflow state lives in Eloquent,
      human-in-the-loop stops being a demo and becomes an approval queue.
  - layout: outro
    kicker: "End of Module 18"
    title: "Next: Tools That Touch\nYour Application"
    note: "Modules 19 and 20 are hands-on — tools against Eloquent, authorisation inside tools, and RAG over application data with permission-filtered retrieval."
    notes: |
      Preview the security thesis that Module 19 states outright and Lesson 23.5
      repeats: do not instruct the model out of doing something it has the
      capability to do — remove the capability.
