slides:
  - layout: cover
    kicker: "Module 17 · Part V — Laravel"
    title: "The Laravel SDK"
    subtitle: "A concurrency-safe facade, and the guidelines that stop your coding assistant writing v2 code."
    meta: "Agentic AI in PHP with NeuronAI · Hidran Arias"
    notes: |
      Part V opens. Most of Module 17 is hands-on — installation, config,
      facades, dependency injection. These two lessons are the conceptual ones.
      Keep Lesson 2.5's framing in view throughout Part V: the SDK adds
      convenience, not capability.

  - layout: agenda
    kicker: "Module 17 · theory lessons"
    title: "Two things worth understanding before you use the facade"
    items:
      - {id: "17.5", title: "Copy, Not Mutate", note: "The facade's concurrency story"}
      - {id: "17.7", title: "Laravel Boost and AI-Assisted Development", note: "Guidelines for coding assistants"}
    notes: |
      17.5 is short but prevents a genuinely nasty class of bug. 17.7 is
